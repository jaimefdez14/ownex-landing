<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 900; src: url("../../public/fonts/inter-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 400; src: url("../../public/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; background: #0e0f0c; font-family: Inter, system-ui, sans-serif;
             display: flex; flex-direction: column; justify-content: space-between; padding: 80px; }
      .wordmark { font-size: 32px; font-weight: 900; color: #ffffff; }
      h1 { font-size: 72px; line-height: 78px; font-weight: 900; letter-spacing: -0.02em; color: #ffffff; max-width: 900px; }
      .rule { width: 64px; height: 4px; background: #34D399; margin-bottom: 32px; }
    </style>
  </head>
  <body>
    <p class="wordmark">Ownex</p>
    <div>
      <div class="rule"></div>
      <h1>La comunidad no es marketing. Es un activo de capital.</h1>
    </div>
  </body>
</html>
