<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      FUENTE DE `public/og-image.png`. Se regenera con `npm run og`.

      REHECHA EL 27/08/2026, Y NO ERA UN RETOQUE. La tarjeta que se estaba
      compartiendo desde agosto tenia cuatro cosas mal a la vez:

        1. El TITULAR era copy retirado. Decia "La comunidad no es marketing. Es
           un activo de capital.", que es la redaccion que la seccion de tesis
           abandono el 19-ago por repetir el giro del hero. O sea que el primer
           contacto con la marca (WhatsApp, LinkedIn, Slack) enseñaba una frase
           que ya no esta en ningun sitio de la pagina.
        2. El WORDMARK iba sin punto. La marca es "Ownex." con el punto en
           acento; sin el no es el wordmark, es el nombre escrito.
        3. La FUENTE no cargaba. Pedia `inter-latin-900-normal.woff2`, un fichero
           que no existe en `public/fonts` (hay 300, 400, 500 y 600), asi que la
           tarjeta salia en la grotesca de reserva del sistema. Ademas el peso
           900 no es de este sistema tipografico: los titulares van en 500.
        4. El FILETE era `#34D399`, el verde brillante que se retiro como acento
           en reposo el 25/08 precisamente por resplandecer.

      Se queda en OSCURO y no en el blanco del hero, a proposito: las tarjetas de
      enlace se ven sobre el fondo claro de un feed o de un chat, y una tarjeta
      blanca sobre fondo blanco no tiene borde. El `#0E0F0C` es el oscuro real de
      la marca (el de `.theme-dark`), no el `#0A0B0C` frio que se retiro.
    -->
    <style>
      @font-face {
        font-family: "Inter";
        font-weight: 400;
        font-style: normal;
        src: url("../../public/fonts/inter-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 500;
        font-style: normal;
        src: url("../../public/fonts/inter-latin-500-normal.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        background: #0e0f0c;
        font-family: Inter, system-ui, sans-serif;
        color: #f4f5f1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        position: relative;
        overflow: hidden;
      }

      /*
        La misma aurora de la seccion de tesis, quieta: dos manchas muy grandes,
        muy desenfocadas y casi transparentes. Sobre 1200x630 planos, es lo que
        evita que la tarjeta se lea como un rectangulo negro impreso.
      */
      .aurora {
        position: absolute;
        border-radius: 9999px;
        background: #10b981;
        filter: blur(120px);
      }
      .aurora-a { width: 520px; height: 520px; top: -180px; left: -120px; opacity: 0.16; }
      .aurora-b { width: 420px; height: 420px; right: -110px; bottom: -190px; opacity: 0.11; }

      .row { position: relative; display: flex; align-items: center; justify-content: space-between; }

      .wordmark { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; color: #f4f5f1; }
      .wordmark span { color: #10b981; }

      .eyebrow {
        font-size: 15px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #8c918a;
      }

      .block { position: relative; }

      /* La escala real de `.display-hero`: peso 500, tracking -0.035em, interlineado 1.03. */
      h1 {
        font-size: 78px;
        line-height: 1.03;
        font-weight: 500;
        letter-spacing: -0.035em;
        max-width: 880px;
      }
      h1 span { color: #10b981; }

      p.lede {
        margin-top: 26px;
        font-size: 25px;
        line-height: 1.45;
        font-weight: 300;
        color: #a8ada4;
        max-width: 760px;
      }

      /* Las mismas tres pruebas regulatorias que lleva el hero desde el 26/08. */
      ul { position: relative; display: flex; gap: 34px; list-style: none; }
      li { display: flex; align-items: center; gap: 10px; font-size: 17px; color: #a8ada4; }
      li svg { flex: none; }
    </style>
  </head>
  <body>
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>

    <div class="row">
      <p class="wordmark">Ownex<span>.</span></p>
      <!--
        El dominio y no una prueba regulatoria: las tres pruebas ya van abajo, y
        repetirlas arriba solo gastaba la esquina. En una tarjeta compartida el
        dominio es el dato que le falta a quien la recibe.
      -->
      <p class="eyebrow">ownex.co</p>
    </div>

    <div class="block">
      <h1>Turn your customers into <span>shareholders.</span></h1>
      <p class="lede">
        Funding from your own community, within a legal framework and without complicating your cap table.
      </p>
    </div>

    <ul>
      <li>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        Structured under Spanish Law 6/2023
      </li>
      <li>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        Entities supervised by the CNMV
      </li>
      <li>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        Your cap table, in a single line
      </li>
    </ul>
  </body>
</html>
